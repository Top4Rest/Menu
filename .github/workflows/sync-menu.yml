name: Sync menu from Google Sheets

# Тянет данные из опубликованных вкладок Google-таблицы, кладёт их в data/
# И СРАЗУ САМ деплоит сайт на GitHub Pages в этом же запуске.
# Почему деплой встроен сюда, а не в отдельный static.yml:
# пуш, сделанный штатным GITHUB_TOKEN, НЕ запускает другие workflow
# (защита GitHub от рекурсии), поэтому push-триггер static.yml не срабатывал
# и Pages застревал на старом деплое.

on:
  schedule:
    - cron: '*/10 * * * *'   # каждые ~10 минут (UTC; GitHub может задерживать запуск)
  workflow_dispatch:          # ручной запуск: вкладка Actions → этот workflow → Run workflow

permissions:
  contents: write             # коммит обновлённых CSV
  pages: write                # деплой на Pages
  id-token: write             # OIDC для actions/deploy-pages

concurrency:
  group: sync-menu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSVs from Google Sheets
        run: |
          mkdir -p data
          BASE="https://docs.google.com/spreadsheets/d/e/2PACX-1vTrE_g7uZIKr2OxbIcPtB06mdcXg11hqYDHU7yzkzSabMqt46YHPmIZo76t_JtZLmHt65BHErLykBp2/pub"
          curl -sSL --fail --retry 3 --retry-delay 5 "$BASE?output=csv"                          -o data/kompleks.csv
          curl -sSL --fail --retry 3 --retry-delay 5 "$BASE?gid=601791011&single=true&output=csv" -o data/menu.csv
          curl -sSL --fail --retry 3 --retry-delay 5 "$BASE?gid=155115519&single=true&output=csv" -o data/sostav.csv
          # Защита от пустого ответа Google: не перезаписываем рабочие данные мусором
          for f in kompleks menu sostav; do
            if [ ! -s "data/$f.csv" ]; then echo "::error::data/$f.csv пустой — прерываю"; exit 1; fi
          done

      - name: Commit if changed
        run: |
          git config user.name  "menu-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kompleks.csv data/menu.csv data/sostav.csv
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "Sync menu data from Google Sheets"
            git push
          fi

      # --- Деплой на GitHub Pages в этом же запуске ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'               # весь репозиторий (index.html + data/)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
